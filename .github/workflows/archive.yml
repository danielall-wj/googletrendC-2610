name: Daily CSV archive
on:
  schedule:
    - cron: '0 9 * * *' # 18:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: trends-data
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/archive_csv.py
      - name: Commit dated CSV archive
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          test -n "$COMMIT_NAME" && test -n "$COMMIT_EMAIL" || { echo 'Missing commit identity variables.'; exit 1; }
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add archives/csv
          if ! git diff --cached --quiet; then
            git commit -m "data: daily CSV archive $(date -u +%FT%H:%MZ)"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
