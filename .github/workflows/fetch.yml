name: Collect Google Trends
on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: trends-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect all countries, news and history
        id: trends
        continue-on-error: true
        run: python scripts/fetch_trends.py --geo KR,US,JP --hours 4,24,48,168 --news-budget 80
      - name: Daily Explore (all four periods, all countries)
        id: explore
        continue-on-error: true
        run: python scripts/explore.py --geo KR,US,JP --periods 7d,1m,3m,12m --once-per-day
      - name: News-word analysis (today KST, weekly rollup on Sundays)
        id: analysis
        continue-on-error: true
        run: python scripts/analysis.py --geo KR,US,JP
      - name: Persist successful data and failure metadata
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          test -n "$COMMIT_NAME" && test -n "$COMMIT_EMAIL" || { echo 'Set COMMIT_NAME and COMMIT_EMAIL repository variables for Vercel Git deployment.'; exit 1; }
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Google Trends $(date -u +%FT%H:%MZ)"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Report collector failure
        if: steps.trends.outcome == 'failure' || steps.explore.outcome == 'failure' || steps.analysis.outcome == 'failure'
        run: exit 1
      - name: Open an issue after consecutive failures
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const {owner, repo} = context.repo;
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'fetch.yml', status: 'completed', per_page: 1});
            if (data.workflow_runs[0]?.conclusion !== 'failure') return;
            const title = '[자동 알림] Google 트렌드 수집 연속 실패';
            const issues = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state: 'open', creator: 'github-actions[bot]'});
            if (issues.some(issue => issue.title === title)) return;
            await github.rest.issues.create({owner, repo, title, body: `연속 수집 실패를 확인했습니다. 마지막 정상 데이터는 보존됩니다.\n\n실행 로그: https://github.com/${owner}/${repo}/actions/runs/${context.runId}`});
