name: Discord briefing
on:
  schedule:
    - cron: '0 10 * * *' # 19:00 KST — KR/JP/US Top 5, once daily
  workflow_dispatch:
    inputs:
      slot:
        description: 'Briefing type'
        type: choice
        options: [daily, test]
        default: test
permissions:
  contents: write
concurrency:
  group: trends-data
  cancel-in-progress: false
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check delivery configuration
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          test -n "$COMMIT_NAME" && test -n "$COMMIT_EMAIL" && test -n "$DISCORD_WEBHOOK_URL" || { echo 'Missing commit identity or Discord webhook secret.'; exit 1; }
      - name: Send briefing (skip already delivered slot)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          SLOT: ${{ inputs.slot || 'auto' }}
        run: python scripts/notify_discord.py --slot "$SLOT"
      - name: Persist daily delivery receipt (including partial progress)
        if: always()
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          git add state/discord.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: record Discord briefing delivery"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
